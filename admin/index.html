<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANEA JWELS Admin</title><style>body{font-family:Arial;margin:0;background:#f7f0e7;color:#2b1712}.wrap{max-width:1100px;margin:auto;padding:28px}.box{background:#fffaf5;padding:24px;border-radius:18px;margin:18px 0}input,button{padding:12px;border-radius:8px;border:1px solid #d8c8bb;margin:5px}button{background:#2b1712;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:20px;background:#fff;border-radius:15px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>ANEA JWELS ADMIN</h1><div class="box" id="login"><h2>Admin OTP Login</h2><input id="phone" placeholder="+91xxxxxxxxxx"><button onclick="sendOtp()">Send OTP</button><div><input id="otp" placeholder="OTP"><button onclick="verifyOtp()">Verify</button></div><p id="msg"></p></div><div id="dash" hidden><div class="grid"><div class="stat">Products <b id="p">0</b></div><div class="stat">Orders <b id="o">0</b></div><div class="stat">Customers <b id="c">0</b></div><div class="stat">Pending Payments <b id="pay">0</b></div></div><div class="box"><h2>Dashboard</h2><p>Products · Categories · Orders · Customers · Payments · Reviews · Settings</p><button onclick="logout()">Logout</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function sendOtp(){let phone=document.getElementById('phone').value.trim();let r=await sb.auth.signInWithOtp({phone});document.getElementById('msg').textContent=r.error?r.error.message:'OTP sent.'}async function verifyOtp(){let phone=document.getElementById('phone').value.trim(),token=document.getElementById('otp').value.trim();let r=await sb.auth.verifyOtp({phone,token,type:'sms'});if(r.error)return document.getElementById('msg').textContent=r.error.message;let a=await sb.from('admin_profiles').select('user_id').eq('user_id',r.data.user.id).maybeSingle();if(!a.data){await sb.auth.signOut();return document.getElementById('msg').textContent='This phone is not authorized.'}document.getElementById('login').hidden=true;document.getElementById('dash').hidden=false;loadStats()}async function loadStats(){for(const [id,t] of [['p','products'],['o','orders'],['c','customers']]){let r=await sb.from(t).select('*',{count:'exact',head:true});document.getElementById(id).textContent=r.count??0}let r=await sb.from('orders').select('*',{count:'exact',head:true}).eq('payment_status','pending');document.getElementById('pay').textContent=r.count??0}async function logout(){await sb.auth.signOut();location.reload()}</script></body></html>
